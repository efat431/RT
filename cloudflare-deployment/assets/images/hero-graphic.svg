<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="hero-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B18" />
      <stop offset="50%" stop-color="#141416" />
      <stop offset="100%" stop-color="#0A0A0B" />
    </linearGradient>
    <linearGradient id="accent-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#B45309" stop-opacity="0.0" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#262626" stroke-width="0.75" stroke-opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" rx="16" fill="url(#hero-grad-1)" />
  <rect width="800" height="600" rx="16" fill="url(#grid)" />
  <rect width="800" height="600" rx="16" stroke="#262626" stroke-width="1.5" />

  <!-- Ambient Light Orbs -->
  <circle cx="580" cy="180" r="220" fill="url(#accent-glow)" filter="blur(60px)" />
  
  <!-- Architectural Wireframe Grid & Cards -->
  <g transform="translate(60, 60)">
    <!-- Inner Card 1 -->
    <rect x="40" y="40" width="380" height="240" rx="12" fill="#18181B" stroke="#27272A" stroke-width="1" />
    <circle cx="70" cy="70" r="10" fill="#D97706" />
    <line x1="95" y1="70" x2="220" y2="70" stroke="#F4F4F5" stroke-width="4" stroke-linecap="round" />
    <line x1="70" y1="110" x2="350" y2="110" stroke="#71717A" stroke-width="2" stroke-linecap="round" />
    <line x1="70" y1="130" x2="310" y2="130" stroke="#71717A" stroke-width="2" stroke-linecap="round" />
    <line x1="70" y1="150" x2="280" y2="150" stroke="#71717A" stroke-width="2" stroke-linecap="round" />
    <rect x="70" y="190" width="120" height="36" rx="6" fill="#D97706" />
    <rect x="205" y="190" width="100" height="36" rx="6" fill="#27272A" />

    <!-- Isometric Graph Floating Overlay -->
    <g transform="translate(240, 180)">
      <rect width="360" height="220" rx="12" fill="#121214" stroke="#D97706" stroke-width="1" stroke-opacity="0.6" filter="drop-shadow(0 20px 30px rgba(0,0,0,0.7))" />
      <text x="24" y="38" fill="#F5F5F5" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600">Performance Invariants</text>
      <path d="M 24 160 Q 90 120 150 140 T 260 70 T 330 40" fill="none" stroke="#D97706" stroke-width="3" stroke-linecap="round" />
      <circle cx="330" cy="40" r="5" fill="#FBBF24" />
      <text x="280" y="30" fill="#FBBF24" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">+142%</text>
    </g>
  </g>
</svg>
